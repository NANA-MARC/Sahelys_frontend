<app-header backUrl="/chat" title="Mon Profil" [showSearch]="false"></app-header>

<ng-container *ngIf="user$ | async as user">
  <main class="profile-shell">
    <app-toast *ngIf="toastMessage()" [message]="toastMessage()!" type="success"></app-toast>

    <div class="profile-layout">

      <!-- ========== Panneau Gauche : Identité ========== -->
      <aside class="profile-sidebar">
        <div class="avatar-wrapper">
          <div class="avatar-circle">{{ user.nom.charAt(0) }}</div>
          <div class="avatar-glow"></div>
        </div>

        <h2 class="profile-name">{{ user.prenom }} {{ user.nom }}</h2>

        <div class="badge-row">
          <span class="badge badge--role">
            <svg [lucideIcon]="Shield" size="13"></svg>
            {{ user.role }}
          </span>
          <span class="badge badge--direction">
            <svg [lucideIcon]="Building" size="13"></svg>
            {{ user.direction }}
          </span>
        </div>

        <div class="sidebar-meta">
          <div class="meta-item">
            <svg [lucideIcon]="UserIcon" size="16" class="meta-icon"></svg>
            <div>
              <span class="meta-label">Email</span>
              <span class="meta-value">{{ user.email }}</span>
            </div>
          </div>
          <div class="meta-item">
            <svg [lucideIcon]="Building" size="16" class="meta-icon"></svg>
            <div>
              <span class="meta-label">Direction</span>
              <span class="meta-value">{{ user.direction }}</span>
            </div>
          </div>
        </div>

        <button type="button" class="logout-btn" (click)="logout()">
          <svg [lucideIcon]="LogOut" size="16"></svg>
          Déconnexion
        </button>
      </aside>

      <!-- ========== Panneau Droit : Formulaire ========== -->
      <div class="profile-content">

        <!-- Section Informations Personnelles -->
        <section class="profile-card">
          <div class="card-header">
            <svg [lucideIcon]="UserIcon" size="20" class="card-icon"></svg>
            <div>
              <h3>Informations personnelles</h3>
              <p class="card-subtitle">Modifiez vos informations de contact</p>
            </div>
          </div>

          <div class="field-grid">
            <label class="field">
              <span class="field-label">Prénom</span>
              <input type="text" [value]="user.prenom" class="field-input" />
            </label>
            <label class="field">
              <span class="field-label">Nom de famille</span>
              <input type="text" [value]="user.nom" class="field-input" />
            </label>
            <label class="field field--full">
              <span class="field-label">Adresse email</span>
              <input type="email" [value]="user.email" class="field-input" />
            </label>
            <label class="field field--full">
              <span class="field-label">Direction rattachée</span>
              <input type="text" [value]="user.direction" readonly class="field-input field-input--readonly" />
            </label>
          </div>
        </section>

        <!-- Section Sécurité -->
        <section class="profile-card">
          <div class="card-header">
            <svg [lucideIcon]="Key" size="20" class="card-icon"></svg>
            <div>
              <h3>Sécurité</h3>
              <p class="card-subtitle">Modifiez votre mot de passe</p>
            </div>
          </div>

          <div class="field-grid">
            <label class="field field--full">
              <span class="field-label">Mot de passe actuel</span>
              <div class="password-wrap">
                <input [type]="showPassword ? 'text' : 'password'" value="1234567890" class="field-input" />
                <button type="button" class="eye-btn" (click)="togglePassword()">
                  <svg [lucideIcon]="showPassword ? EyeOff : Eye" size="18"></svg>
                </button>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Nouveau mot de passe</span>
              <input type="password" placeholder="••••••••" class="field-input" />
            </label>
            <label class="field">
              <span class="field-label">Confirmer le mot de passe</span>
              <input type="password" placeholder="••••••••" class="field-input" />
            </label>
          </div>
        </section>

        <!-- Actions -->
        <div class="form-actions">
          <button type="button" class="save-btn" (click)="saveProfile()">
            <svg [lucideIcon]="Check" size="18"></svg>
            Enregistrer les modifications
          </button>
        </div>

      </div>
    </div>
  </main>
</ng-container>
