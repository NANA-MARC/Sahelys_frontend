<section class="access-denied-page">
  <div class="access-denied-card">
    <div class="code">403</div>
    <h1>Accès refusé</h1>
    <p>Vous n’avez pas les droits nécessaires pour consulter cette page.</p>

    <div class="actions">
      <button type="button" class="primary-btn" (click)="goToLogin()">Retour à la connexion</button>
      <a routerLink="/chat" class="secondary-link">Retour à l’accueil</a>
    </div>
  </div>
</section>
