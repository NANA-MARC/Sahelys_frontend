<section class="login-page">
  <div class="login-card">
    <div class="login-card__header">
      <div class="brand" aria-label="SAHELYS">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">SAHELYS</span>
      </div>
      <h1>Connexion</h1>
      <p class="subtitle">Accédez à vos agents SAHELYS</p>
    </div>

    <!-- Alerte de session expirée -->
    @if (isSessionExpired()) {
      <div class="warning-alert" role="alert" style="background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); color: #d97706; padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem;">
        Votre session a expiré. Veuillez vous reconnecter pour continuer.
      </div>
    }

    <!-- Message d'erreur s'il y a un échec de connexion -->
    @if (errorMessage()) {
      <div class="error-alert" role="alert" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem;">
        {{ errorMessage() }}
      </div>
    }

    <form class="login-form" (ngSubmit)="login()" #form="ngForm">
      <label class="field">
        <span>Identifiant / Adresse email *</span>
        <input 
          type="text" 
          name="email" 
          [(ngModel)]="formModel.email" 
          placeholder="Moussa KIENDREBEOGO ou email"
          required 
          [disabled]="isLoading()"
        />
      </label>

      <label class="field">
        <span>Mot de passe *</span>
        <span class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="formModel.password"
            required
            [disabled]="isLoading()"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="
              showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
            "
            (click)="showPassword = !showPassword"
          >
            <span class="eye-icon" aria-hidden="true"></span>
          </button>
        </span>
      </label>

      <a class="forgot-password" href="#">Mot de passe oublié ?</a>

      <button
        type="submit"
        class="primary-btn"
        [disabled]="!formModel.email || !formModel.password || isLoading()"
      >
        @if (isLoading()) {
          <span>Connexion en cours...</span>
        } @else {
          <span>Se connecter</span>
        }
      </button>
    </form>
  </div>
</section>
